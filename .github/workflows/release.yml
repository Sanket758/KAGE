name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev file
      - name: Test and build plugin bundle
        run: |
          npm ci
          npm test
          npm run build:plugin
      - name: Build Tauri release bundles
        run: cd apps/desktop && npm run tauri:build
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp apps/desktop/src-tauri/target/release/bundle/appimage/KAGE_*_amd64.AppImage dist/
          cp apps/desktop/src-tauri/target/release/bundle/deb/KAGE_*_amd64.deb dist/
          cp packages/opencode-plugin/dist/index.js dist/kage.js
          cp scripts/install.sh dist/install.sh
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
